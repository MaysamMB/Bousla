name: bousla_app
description: Bousla instructor application and student web portal.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  bousla_engine:
    path: ../engine
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_ai: ^5.1.0
  file_picker: ^13.4.1
  firebase_app_check: ^0.5.1
  qr_flutter: ^4.1.0
  # Already in the app through Firebase; used directly to save the knowledge map.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.5.0

flutter:
  uses-material-design: true
  generate: true

  # Bundled fonts (SIL Open Font License, see assets/fonts/OFL.txt), so text
  # never depends on downloading fonts at the venue. Used together through
  # fontFamily + fontFamilyFallback in lib/app.dart:
  #   NotoSans        Latin letters and punctuation (subset)
  #   NotoSansArabic  Arabic (has no Latin letters)
  #   NotoSansMath    arrows and math operators only, e.g. "A → B" (subset)
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-Symbols.ttf
