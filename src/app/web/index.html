<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bousla: answer a short quiz and see what you understand and what to learn next.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0B1230">
  <meta name="apple-mobile-web-app-title" content="Bousla">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bousla · بوصلة</title>
  <link rel="manifest" href="manifest.json">
  <!-- Splash screen from the Bousla identity (find-your-bousla.base44.app/splash):
       one mark in the middle, the name and tagline under it, a thin progress
       line. The night version is the primary one; the light one is used when
       the user chose the light theme in the app. Shown at once, before Flutter
       has downloaded (several MB on the first visit); removed on Flutter's
       first frame. Plain HTML, CSS and inline SVG only. -->
  <style>
    @font-face {
      font-family: "BouslaArabic"; font-weight: 700; font-display: swap;
      src: url("assets/assets/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "BouslaArabic"; font-weight: 400; font-display: swap;
      src: url("assets/assets/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");
    }
    html, body { margin: 0; height: 100%; background: #0B1230; }
    html.light, html.light body { background: #F6F8FC; }
    #bousla-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      font-family: "BouslaArabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #FFFFFF; text-align: center; transition: opacity .3s;
      background: radial-gradient(circle at 50% 42%, rgba(52,227,182,.22), transparent 62%), #0B1230;
    }
    html.light #bousla-splash {
      color: #0B1230;
      background: radial-gradient(circle at 50% 42%, rgba(52,227,182,.16), transparent 62%), #F6F8FC;
    }
    #bousla-splash .mark { width: 96px; height: 96px; animation: bousla-draw 1.1s cubic-bezier(.22,1,.36,1) both; }
    #bousla-splash .ring { stroke: #34E3B6; stroke-opacity: .5; }
    #bousla-splash .down { fill: #34E3B6; }
    html.light #bousla-splash .ring { stroke: #0B1230; stroke-opacity: .18; }
    html.light #bousla-splash .down { fill: #0E9E86; }
    #bousla-splash .name { font-size: 34px; font-weight: 700; line-height: 1.2; }
    #bousla-splash .tagline { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.55); }
    html.light #bousla-splash .tagline { color: #5B6480; }
    #bousla-splash .rise { animation: bousla-rise .9s cubic-bezier(.22,1,.36,1) .14s both; }
    #bousla-splash .rise2 { animation-delay: .21s; }
    #bousla-splash .bar {
      position: absolute; bottom: 48px; left: 50%; width: 96px; height: 4px;
      margin-left: -48px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.1);
    }
    html.light #bousla-splash .bar { background: rgba(11,18,48,.1); }
    #bousla-splash .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 66%;
      border-radius: 2px; background: #34E3B6; animation: bousla-bar 1.6s ease-in-out infinite;
    }
    /* Only if loading is slow (venue network): say why we are waiting. */
    #bousla-splash .slow {
      position: absolute; bottom: 72px; left: 16px; right: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      font-size: 12px; line-height: 1.7; color: rgba(255,255,255,.45);
      opacity: 0; animation: bousla-fade .6s ease 4s forwards;
    }
    html.light #bousla-splash .slow { color: #5B6480; }
    @keyframes bousla-draw { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes bousla-rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @keyframes bousla-bar { from { left: -66%; } to { left: 100%; } }
    @keyframes bousla-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #bousla-splash .mark, #bousla-splash .rise { animation: none; }
      #bousla-splash .bar::after { animation-duration: 4s; }
    }
  </style>
</head>
<body>
  <script>
    // Same light/dark choice as the app (lib/shared/theme_mode_store_web.dart).
    // The splash is the night version unless the user picked the light theme.
    try { if (localStorage.getItem('bousla.themeMode') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
  </script>
  <div id="bousla-splash" role="status" aria-live="polite">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="splash-amber" x1="50" y1="4" x2="50" y2="50" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#FFB020"/>
        </linearGradient>
      </defs>
      <path class="ring" d="M36.7 18.7A34 34 0 1 0 63.3 18.7" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 6C53 32 58 42 70 50L30 50C42 42 47 32 50 6Z" fill="url(#splash-amber)"/>
      <path class="down" d="M30 50C42 58 47 68 50 74C53 68 58 58 70 50Z"/>
    </svg>
    <div>
      <div class="name rise" lang="ar">بوصلة</div>
      <div class="tagline rise rise2" lang="ar" dir="rtl">اتجاه أوضح للتعلّم</div>
    </div>
    <div class="slow">
      <div dir="rtl" lang="ar">جاري التحميل… قد يستغرق ذلك بضع ثوانٍ في أول مرة.</div>
      <div dir="ltr" lang="en">Loading… The first visit can take a few seconds.</div>
    </div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('bousla-splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
